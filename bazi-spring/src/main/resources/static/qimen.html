<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qi Men Dun Jia</title>
<style>
  :root {
    --wood:#2e9e5b; --fire:#e2483d; --earth:#b8860b; --metal:#8a94a6; --water:#2f6fd0;
    --bg:#0f1420; --card:#1a2130; --card2:#222c3e; --line:#33415a; --txt:#e8edf6; --dim:#93a0b8;
    --good:#4fbf74; --bad:#e2483d;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans CJK SC","PingFang SC",sans-serif;
         background:var(--bg); color:var(--txt); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; justify-content:space-between; gap:16px; }
  a.navlink { color:#9db7f5; text-decoration:none; font-size:13px; }
  a.navlink:hover { text-decoration:underline; }
  h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  h1 small { color:var(--dim); font-weight:400; font-size:13px; margin-left:8px; }
  .wrap { padding:20px 24px 60px; max-width:1180px; margin:0 auto; }
  form { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; background:var(--card);
         padding:16px; border-radius:12px; border:1px solid var(--line); margin-bottom:20px; }
  label { display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--dim); }
  input,select { background:var(--bg); color:var(--txt); border:1px solid var(--line);
         border-radius:8px; padding:8px 10px; font-size:14px; }
  input[type=number] { width:110px; }
  button { background:#3d6fe0; color:#fff; border:0; border-radius:8px; padding:10px 20px;
         font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:#4d7ff0; }
  .chk { flex-direction:row; align-items:center; gap:6px; }
  .chk input { width:auto; }
  .err { background:#3a1c1c; border:1px solid #7a2c2c; color:#ffb4b4; padding:12px 16px;
         border-radius:10px; margin-bottom:20px; }
  .muted { color:var(--dim); font-size:13px; }
  .section { margin-top:24px; }
  .section h2 { font-size:14px; text-transform:uppercase; letter-spacing:1.5px; color:var(--dim);
         margin:0 0 12px; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .tag { display:inline-block; background:var(--card2); border:1px solid var(--line); border-radius:999px;
         padding:2px 9px; font-size:11px; color:var(--dim); margin:2px 4px 2px 0; }
  .tag b { color:var(--txt); font-weight:600; }
  .tag.good { border-color:#2e6b45; color:var(--good); }
  .tag.bad { border-color:#7a2c2c; color:var(--bad); }
  .detailgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat { background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .stat .k { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .stat .v { font-size:15px; font-weight:600; margin-top:4px; }

  .palgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .pal { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px;
         min-height:210px; display:flex; flex-direction:column; gap:6px; position:relative; }
  .pal.center { background:var(--card2); }
  .pal.lead { border-color:#3d6fe0; box-shadow:0 0 0 1px #3d6fe0 inset; }
  .palhead { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .palhead .pn { font-size:16px; font-weight:700; }
  .palhead .cn { color:var(--dim); font-size:12px; margin-left:4px; font-weight:400; }
  .badges { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .badge { font-size:10px; border-radius:4px; padding:1px 5px; background:var(--card2);
           border:1px solid var(--line); color:var(--dim); }
  .badge.lead { background:#3d6fe0; border-color:#3d6fe0; color:#fff; font-weight:700; }
  .badge.void { color:var(--bad); border-color:#7a2c2c; }
  .badge.horse { color:var(--earth); }
  .palrow { font-size:13px; line-height:1.5; }
  .palrow .lbl { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px;
                 display:inline-block; min-width:52px; }
  .stem { font-weight:600; }
  .meta { border-top:1px dashed var(--line); margin-top:auto; padding-top:6px; font-size:11px; color:var(--dim); }
  .meta .line { margin:2px 0; }
  .wood{color:var(--wood)} .fire{color:var(--fire)} .earth{color:var(--earth)}
  .metal{color:var(--metal)} .water{color:var(--water)}
  @media (max-width:900px){ .palgrid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>Qi Men Dun Jia <small id="sub">奇門遁甲 · core plot</small></h1>
  <nav style="display:flex; gap:16px">
    <a class="navlink" href="/">← BaZi chart</a>
    <a class="navlink" href="/almanac.html">Almanac</a>
    <a class="navlink" href="/hexagrams.html">Yi Jing</a>
    <a class="navlink" href="/fengshui.html">Feng Shui</a>
    <a class="navlink" href="/qimen-days.html">Day scan</a>
    <a class="navlink" href="/qimen-symbols.html">Symbols →</a>
    <a class="navlink" href="/library.html">Library</a>
    <a class="navlink" href="/tutorials.html">Tutorials</a>
  </nav>
</header>
<div class="wrap">
  <form id="f">
    <label>Date &amp; time
      <input type="datetime-local" id="time" step="1" value="1990-05-15T14:30:00" required>
    </label>
    <label>Reference
      <select id="reference">
        <option value="hour">Hour</option>
        <option value="day">Day</option>
        <option value="month">Month</option>
        <option value="year">Year</option>
        <option value="house">House (Feng Shui)</option>
      </select>
    </label>
    <label>Method
      <select id="method">
        <option value="0">Zhi Run (置閏)</option>
        <option value="1">Chai Bu (拆補, hour)</option>
      </select>
    </label>
    <label>Star path
      <select id="starPath">
        <option value="0">Rotating (轉)</option>
        <option value="1">Flying (飛)</option>
      </select>
    </label>
    <label>Naming
      <select id="naming">
        <option value="0">0 · classic</option>
        <option value="1">1 · executive</option>
        <option value="2">2 · shorthand</option>
      </select>
    </label>
    <label>&nbsp;
      <span class="chk"><input type="checkbox" id="shift"> Shift late-zi stream</span>
    </label>
    <label>&nbsp;
      <span class="chk"><input type="checkbox" id="lateZi"> Late-Zi</span>
    </label>
    <label>&nbsp;
      <span class="chk"><input type="checkbox" id="hourUnknown"> Hour unknown</span>
    </label>
    <label>&nbsp;
      <span class="chk"><input type="checkbox" id="destiny"> Destiny lines</span>
    </label>
    <label>&nbsp;
      <span class="chk"><input type="checkbox" id="meta" checked> Meta layer</span>
    </label>
    <label>House year
      <input type="number" id="houseYear" placeholder="2024" min="1844" max="2083">
    </label>
    <label>Sitting degree (houseDegree)
      <input type="number" id="houseDegree" placeholder="60.5" step="0.1">
    </label>
    <label>Facing degree (doorDegree)
      <input type="number" id="doorDegree" placeholder="210.5" step="0.1">
    </label>
    <button type="submit">Plot</button>
  </form>
  <div id="err" class="err" style="display:none"></div>
  <div id="out"></div>
</div>

<script>
const STEM_CN = {jia:"甲",yi:"乙",bing:"丙",ding:"丁",wu:"戊",ji:"己",geng:"庚",xin:"辛",ren:"壬",gui:"癸"};
const STEM_EL = {jia:"wood",yi:"wood",bing:"fire",ding:"fire",wu:"earth",ji:"earth",geng:"metal",xin:"metal",ren:"water",gui:"water"};
const EL_CN = {wood:"木",fire:"火",earth:"土",metal:"金",water:"水"};
const BRANCH_CN = {zi:"子",chou:"丑",yin:"寅",mao:"卯",chen:"辰",si:"巳",wu:"午",wei:"未",shen:"申",you:"酉",xu:"戌",hai:"亥"};
const PALACE_CN = {kan:"坎",kun:"坤",zhen:"震",xun:"巽",center:"中",qian:"乾",dui:"兌",gen:"艮",li:"離"};
const PALACE_TRIGRAM = {kan:"☵",kun:"☷",zhen:"☳",xun:"☴",center:"⊙",qian:"☰",dui:"☱",gen:"☶",li:"☲"};
const DOOR_CN = {rest:"休門",life:"生門",harm:"傷門",delusion:"杜門",scenery:"景門",death:"死門",fear:"驚門",open:"開門"};
const DOOR_EN = {rest:"Rest",life:"Life",harm:"Harm",delusion:"Delusion",scenery:"Scenery",death:"Death",fear:"Fear",open:"Open"};
const STAR_CN = {grass:"天蓬",grain:"天芮",destructor:"天沖",assistant:"天輔",bird:"天禽",heart:"天心",pillar:"天柱",ambassador:"天任",hero:"天英"};
const STAR_EN = {grass:"Grass",grain:"Grain",destructor:"Destructor",assistant:"Assistant",bird:"Bird",heart:"Heart",pillar:"Pillar",ambassador:"Ambassador",hero:"Hero"};
const SPIRIT_CN = {chief:"值符",snake:"螣蛇",moon:"太陰",harmony:"六合",hook:"勾陳",phoenix:"朱雀",earth:"九地",heaven:"九天",tortoise:"玄武",tiger:"白虎"};
const SPIRIT_EN = {chief:"Chief",snake:"Snake",moon:"Moon",harmony:"Harmony",hook:"Hook",phoenix:"Phoenix",earth:"Earth",heaven:"Heaven",tortoise:"Tortoise",tiger:"Tiger"};
const LAYOUT = ["xun","li","kun","zhen","center","dui","gen","kan","qian"];
const PALACE_NAME = {kan:"Kan",kun:"Kun",zhen:"Zhen",xun:"Xun",center:"Center",qian:"Qian",dui:"Dui",gen:"Gen",li:"Li"};
const PALACE_DIR = {kan:"N",kun:"SW",zhen:"E",xun:"SE",center:"—",qian:"NW",dui:"W",gen:"NE",li:"S"};
const REF_CN = {hour:"時 Hour",day:"日 Day",month:"月 Month",year:"年 Year",house:"宅 House"};

const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pretty = s => esc(String(s==null?"":s).replace(/_/g," ").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/^./,c=>c.toUpperCase()));

// ------------------------- MysticDoors.displayTerminology (3 naming conventions)
let TERM = null;   // loaded from /api/qimen/terminology
let LAST = null;   // last chart payload, so the naming select re-renders offline

function disp(kind, key, fallback){
  if(key && TERM){
    const conv = TERM[document.getElementById("naming").value];
    const pair = conv && conv[kind] && conv[kind][key];
    if(pair && pair[0]) return pretty(pair[0]);
  }
  return fallback;
}
const dispDoor = k => disp("door", k, DOOR_CN[k]?DOOR_EN[k]:k);
const dispStar = k => disp("star", k, STAR_CN[k]?STAR_EN[k]:k);
const dispSpirit = k => disp("spirit", k, SPIRIT_CN[k]?SPIRIT_EN[k]:k);

// QiMap.styleQimenChart(): strength fonts + Material interaction icon names
const INTERACTION_GLYPH = {sync:"⟲", redo:"↷", undo:"↶", "arrow-bottom-left":"↙", "arrow-top-right":"↗", christianity:"✝"};
function nameStyle(meta){
  const st = meta && meta.style;
  if(!st) return "";
  const css = [
    st.textDecorationLine ? "text-decoration:" + st.textDecorationLine : "",
    st.fontStyle ? "font-style:" + st.fontStyle : "",
    st.fontWeight ? "font-weight:" + st.fontWeight : "",
  ].filter(Boolean).join(";");
  return css ? ` style="${esc(css)}"` : "";
}
function iconOf(meta, key){
  const name = meta && meta[key];
  return name && INTERACTION_GLYPH[name]
    ? `<span class="muted" title="${esc(name)}">${INTERACTION_GLYPH[name]}</span>` : "";
}
const stemSpan = (s, pre) => s ? `<span class="stem ${STEM_EL[s]||""}">${pre||""}${STEM_CN[s]||esc(s)}</span>` : "";
const branchSpan = (b) => b ? `<span class="stem">${BRANCH_CN[b]||esc(b)}</span>` : "";
const tag = (inner, cls) => `<span class="tag ${cls||""}">${inner}</span>`;

function statBox(k, v){ return `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`; }

function palaceCell(name, entry){
  const p = (entry||{}).plot||{}, m = (entry||{}).meta||{};
  const lead = !!(p.isLeadDoor || p.isLeadStar);
  const badges = `
    ${p.isLeadDoor?'<span class="badge lead">LEAD DOOR</span>':""}
    ${p.isLeadStar?'<span class="badge lead">LEAD STAR</span>':""}
    ${p.isEarthLeadStem||p.isHeavenLeadStem?'<span class="badge lead">LEAD STEM</span>':""}
    ${p.void?'<span class="badge void">VOID</span>':""}
    ${p.horse?'<span class="badge horse">HORSE</span>':""}`;
  const stems = [
    p.earthStem ? `earth ${stemSpan(p.earthStem, "")}` : "",
    p.heavenStem ? `heaven ${stemSpan(p.heavenStem, "")}` : "",
    p.hiddenEarthStem ? `hidden ${stemSpan(p.hiddenEarthStem, "")}` : "",
    p.hiddenHeavenStem ? `hidden-h ${stemSpan(p.hiddenHeavenStem, "")}` : "",
  ].filter(Boolean).join(" · ");

  const doorRow = p.door ? `<div class="palrow"><span class="lbl">Door</span>
      <span${nameStyle(m.door)}>${esc(DOOR_CN[p.door]||"")} ${dispDoor(p.door)}</span>
      ${iconOf(m.door,"palaceInteractionIcon")}${iconOf(m.door,"specialInteractionIcon")}
      ${m.door&&m.door.strength?`<span class="muted">(${esc(m.door.strength)})</span>`:""}
      ${m.door&&m.door.specialInteraction?tag(esc(m.door.specialInteraction)):""}
      ${m.door&&m.door.palaceInteraction?tag(esc(m.door.palaceInteraction)):""}</div>` : "";
  const starRow = p.star ? `<div class="palrow"><span class="lbl">Star</span>
      <span${nameStyle(m.star)}>${esc(STAR_CN[p.star]||"")} ${dispStar(p.star)}</span>
      ${iconOf(m.star,"palaceInteractionIcon")}
      ${m.star&&m.star.strength?`<span class="muted">(${esc(m.star.strength)})</span>`:""}
      ${m.star&&m.star.specialInteraction?tag(esc(m.star.specialInteraction)):""}
      ${m.star&&m.star.palaceInteraction?tag(esc(m.star.palaceInteraction)):""}
      ${p.bird?tag("bird") : ""}</div>` : "";
  const spiritRow = p.spirit ? `<div class="palrow"><span class="lbl">Spirit</span>
      ${esc(SPIRIT_CN[p.spirit]||"")} ${dispSpirit(p.spirit)}</div>` : "";

  const structures = (m.structuresArray||[]).map(s=>{
    const cls = s.rating>0?"good":(s.rating<0?"bad":"");
    return tag(`<b>${pretty(s.name)}</b> ${s.rating>0?"+":""}${s.rating}`, cls);
  }).join(" ");
  const destiny = m.destiny ? `
    <div class="line">destiny ${(m.destiny.range||[]).length?`<span class="muted">ages ${m.destiny.range[0]}–${m.destiny.range[1]}</span>`:""}
      ${(m.destiny.labels||[]).map(l=>tag(pretty(l))).join("")}
      ${m.destiny.isDestinyPalace?tag("<b>destiny palace</b>","good"):""}</div>` : "";
  const hourRating = m.hour && m.hour.doorInteraction
    ? `<div class="line">hour door rating <b>${m.hour.doorInteraction.rating}</b></div>` : "";

  return `<div class="pal ${name==="center"?"center":""} ${lead?"lead":""}">
    <div class="palhead">
      <div><span class="pn">${PALACE_TRIGRAM[name]||""} ${PALACE_NAME[name]}<span class="cn">${PALACE_CN[name]||""}</span></span></div>
      <div class="badges"><span class="badge">#${p.number||""} · P${p.periodNum||""}</span>${badges}</div>
    </div>
    ${doorRow}${starRow}${spiritRow}
    <div class="palrow"><span class="lbl">Stems</span>${stems || "<span class='muted'>—</span>"}</div>
    <div class="meta">${structures?`<div class="line">${structures}</div>`:""}${destiny}${hourRating}</div>
  </div>`;
}

function render(payload){
  LAST = payload;
  const chart = payload.chart;
  if(!chart){
    document.getElementById("out").innerHTML =
      `<div class="card muted">No chart for this input. The RN engine returns nothing here
       (house reference without full house input, tables ending at 2050 for hours, or the
       <code>0-undefined</code> ju days) — parity kept.</div>`;
    return;
  }
  const d = chart.details||{}, P = chart.palaces||{};
  const v = d.victories||{};
  const stemPair = (m) => m ? `${stemSpan(m.stem&&m.stem.name||"", "")} ${branchSpan(m.branch&&m.branch.name||"")}` : "—";
  const forecast = d.forecastStems
    ? `hour ${stemSpan(d.forecastStems.hour,"")} · day ${stemSpan(d.forecastStems.day,"")}` : "—";

  // QiMenDestinySummary: destiny palace + its spirit/star/door under the naming convention
  const dp = d.destinyPalace, dPal = dp ? P[dp] : null;
  const destMeta = dPal && dPal.meta && dPal.meta.destiny;
  const destSummary = (dp && dPal) ? `<div class="section"><h2>Destiny Summary</h2><div class="card detailgrid">
      ${statBox("Palace", `${PALACE_TRIGRAM[dp]||""} ${esc(PALACE_NAME[dp]||dp)} <span class="muted">${PALACE_DIR[dp]||""}</span>`)}
      ${dPal.plot&&dPal.plot.spirit?statBox("Spirit", `${esc(SPIRIT_CN[dPal.plot.spirit]||"")} ${dispSpirit(dPal.plot.spirit)}`):""}
      ${dPal.plot&&dPal.plot.star?statBox("Star", `${esc(STAR_CN[dPal.plot.star]||"")} ${dispStar(dPal.plot.star)}`):""}
      ${dPal.plot&&dPal.plot.door?statBox("Door", `${esc(DOOR_CN[dPal.plot.door]||"")} ${dispDoor(dPal.plot.door)}`):""}
      ${destMeta&&(destMeta.labels||[]).length?statBox("Labels", (destMeta.labels||[]).map(l=>tag(pretty(l))).join(" ")):""}
      ${destMeta&&(destMeta.range||[]).length?statBox("Ages", `${destMeta.range[0]}–${destMeta.range[1]}`):""}
    </div></div>` : "";

  document.getElementById("out").innerHTML = `
    <div class="section"><h2>Details</h2><div class="card detailgrid">
      ${statBox("Dun", esc(d.dun||"—"))}
      ${statBox("Ju", esc(d.ju))}
      ${statBox("Reference", esc(REF_CN[d.reference]||d.reference||"—"))}
      ${statBox("Method", (d.method===1?"Chai Bu (拆補)":"Zhi Run (置閏)"))}
      ${statBox("Star path", (d.starPath===1?"Flying (飛)":"Rotating (轉)"))}
      ${statBox("Lead door", `${esc(DOOR_CN[d.leadDoor]||"")} ${d.leadDoor?dispDoor(d.leadDoor):"—"}`)}
      ${statBox("Lead star", `${esc(STAR_CN[d.leadStar]||"")} ${d.leadStar?dispStar(d.leadStar):"—"}`)}
      ${statBox("Lead stem", stemSpan(d.leadStem,"") || "—")}
      ${statBox("Late-zi shift", d.lateZiStreamShifted ? "shifted" : (d.shiftLateZiStream ? "armed" : "off"))}
      ${statBox("Forecast stems", forecast)}
      ${d.housePeriod!=null?statBox("House period", esc(d.housePeriod)):""}
      ${d.houseStemBranch?statBox("House pillar", stemPair({stem:{name:d.houseStemBranch.split(" ")[0]},branch:{name:d.houseStemBranch.split(" ")[1]}})):""}
      ${d.destinyPalace?statBox("Destiny palace", `${PALACE_TRIGRAM[d.destinyPalace]||""} ${esc(PALACE_NAME[d.destinyPalace]||d.destinyPalace)}`):""}
    </div></div>

    ${destSummary}

    ${d.victories?`<div class="section"><h2>Victories</h2><div class="card">
      ${tag(`Force (生門) ${v.force?`<b>${esc(PALACE_DIR[v.force]||"")} · ${esc(PALACE_NAME[v.force]||v.force)}</b>`:"—"} <span class="muted">${esc(DOOR_CN.life||"")}</span>`)}
      ${tag(`Blessing (九天) ${v.blessing?`<b>${esc(PALACE_DIR[v.blessing]||"")} · ${esc(PALACE_NAME[v.blessing]||v.blessing)}</b>`:"—"}`)}
      ${tag(`Light (值符之星) ${v.light?`<b>${esc(PALACE_DIR[v.light]||"")} · ${esc(PALACE_NAME[v.light]||v.light)}</b>`:"—"}`)}
    </div></div>`:""}

    <div class="section"><h2>Nine Palaces</h2>
      <div class="palgrid">${LAYOUT.map(n=>palaceCell(n, P[n])).join("")}</div>
    </div>

    <div class="section grid2"><h2>Pillars</h2><div class="card">
      year ${stemPair(chart.bazi.pillars.year)} · month ${stemPair(chart.bazi.pillars.month)}
      · day ${stemPair(chart.bazi.pillars.day)} · hour ${stemPair(chart.bazi.pillars.hour)}
      <div class="muted" style="margin-top:6px">${esc(chart.bazi.info.chineseTimeString||"")}</div>
    </div></div>
  `;
}

async function run(e){
  if(e) e.preventDefault();
  const err = document.getElementById("err");
  err.style.display = "none";
  const q = (id) => document.getElementById(id);
  const time = q("time").value;
  if(!time){ err.textContent = "Enter a date/time."; err.style.display = "block"; return; }
  const houseYear = q("houseYear").value, houseDegree = q("houseDegree").value, doorDegree = q("doorDegree").value;
  let url = `/api/qimen/chart?time=${encodeURIComponent(time)}`
    + `&reference=${q("reference").value}&method=${q("method").value}&starPath=${q("starPath").value}`
    + `&shiftLateZiStream=${q("shift").checked}&lateZi=${q("lateZi").checked}`
    + `&hourUnknown=${q("hourUnknown").checked}&destiny=${q("destiny").checked}&meta=${q("meta").checked}`;
  if(houseYear!=="" || houseDegree!=="" || doorDegree!=="") {
    if(houseYear==="" || houseDegree==="" || doorDegree===""){
      err.textContent = "House input needs all three fields (year, sitting degree, facing degree).";
      err.style.display = "block";
      return;
    }
    url += `&houseYear=${houseYear}&houseDegree=${houseDegree}&doorDegree=${doorDegree}`;
  }
  try{
    const r = await fetch(url);
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || ("HTTP "+r.status));
    document.getElementById("sub").textContent = "奇門遁甲 · " + (j.time||"") + " · " + j.reference;
    render(j);
  }catch(ex){
    document.getElementById("out").innerHTML = "";
    err.textContent = ex.message;
    err.style.display = "block";
  }
}

document.getElementById("f").addEventListener("submit", run);

document.getElementById("naming").addEventListener("change", (e) => {
  localStorage.setItem("qimen.naming", e.target.value);
  if(LAST) render(LAST);
});

const savedNaming = localStorage.getItem("qimen.naming");
if(savedNaming && document.querySelector('#naming option[value="'+savedNaming+'"]')){
  document.getElementById("naming").value = savedNaming;
}

async function loadTerminology(){
  try{
    const r = await fetch("/api/qimen/terminology");
    if(r.ok) TERM = await r.json();
  }catch(_){ /* built-in name tables are the convention-0 fallback */ }
}

loadTerminology().then(run);
</script>
