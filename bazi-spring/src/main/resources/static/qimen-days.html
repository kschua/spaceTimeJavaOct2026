<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qi Men Day Scan</title>
<style>
  :root {
    --bg:#0f1420; --card:#1a2130; --card2:#222c3e; --line:#33415a; --txt:#e8edf6; --dim:#93a0b8;
    --accent:#3d6fe0; --good:#4fbf74; --bad:#e2483d; --gold:#e6b84c;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans CJK SC","PingFang SC",sans-serif;
         background:var(--bg); color:var(--txt); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; justify-content:space-between; gap:16px; }
  a.navlink { color:#9db7f5; text-decoration:none; font-size:13px; }
  a.navlink:hover { text-decoration:underline; }
  h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  h1 small { color:var(--dim); font-weight:400; font-size:13px; margin-left:8px; }
  .wrap { padding:20px 24px 60px; max-width:1180px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .formgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px 16px; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim);
          margin-bottom:5px; }
  input[type=text], input[type=date], input[type=datetime-local], input[type=number], select {
    width:100%; background:var(--card2); color:var(--txt); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; font-size:14px; }
  input:focus, select:focus { outline:1px solid var(--accent); border-color:var(--accent); }
  .checks { display:flex; align-items:center; gap:18px; margin-top:14px; flex-wrap:wrap; }
  .checks label { text-transform:none; letter-spacing:0; font-size:13px; color:var(--txt);
                  display:flex; align-items:center; gap:6px; margin:0; }
  .row { display:flex; gap:12px; align-items:center; margin-top:16px; flex-wrap:wrap; }
  button { background:var(--accent); color:#fff; border:0; border-radius:9px; padding:10px 22px;
           font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button.secondary { background:transparent; color:var(--dim); border:1px solid var(--line); font-weight:400; }
  .status { color:var(--dim); font-size:13px; }
  .err { background:#3a1c1c; border:1px solid #7a2c2c; color:#ffb4b4; padding:12px 16px;
         border-radius:10px; margin-bottom:14px; display:none; }
  .summary { color:var(--dim); font-size:13px; margin:18px 0 10px; }
  .days { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; }
  .day { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .day.victory { border-color:var(--gold); box-shadow:0 0 0 1px rgba(230,184,76,.35) inset; }
  .day h3 { margin:0; font-size:15px; display:flex; align-items:center; justify-content:space-between;
            gap:8px; }
  .badge { font-size:11px; font-weight:700; letter-spacing:.5px; color:#1b1405; background:var(--gold);
           border-radius:999px; padding:3px 9px; white-space:nowrap; }
  .count { color:var(--dim); font-size:12px; margin:6px 0 4px; }
  .hours { list-style:none; margin:0; padding:0; }
  .hours li { display:flex; justify-content:space-between; gap:10px; padding:6px 0;
              border-top:1px solid var(--line); font-size:13px; }
  .hours .h { color:#cfe0ff; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hours .s { color:var(--dim); text-align:right; }
  .hours .s b { color:var(--txt); font-weight:600; }
  .empty { color:var(--dim); font-size:13px; }
  code { color:#9db7f5; }
</style>
</head>
<body>
<header>
  <h1>Qi Men Day Scan <small>奇門日課 · good hours + victory days</small></h1>
  <nav style="display:flex; gap:16px; flex-wrap:wrap">
    <a class="navlink" href="/">← BaZi chart</a>
    <a class="navlink" href="/almanac.html">Almanac</a>
    <a class="navlink" href="/hexagrams.html">Yi Jing</a>
    <a class="navlink" href="/fengshui.html">Feng Shui</a>
    <a class="navlink" href="/qimen.html">Qi Men chart</a>
    <a class="navlink" href="/qimen-symbols.html">Symbols</a>
    <a class="navlink" href="/library.html">Library</a>
    <a class="navlink" href="/tutorials.html">Tutorials</a>
  </nav>
</header>
<div class="wrap">
  <div id="err" class="err"></div>

  <div class="card">
    <div class="formgrid">
      <div>
        <label for="from">From</label>
        <input type="date" id="from">
      </div>
      <div>
        <label for="to">To (optional, defaults to month end)</label>
        <input type="date" id="to">
      </div>
      <div>
        <label for="method">Method</label>
        <select id="method">
          <option value="0">0 · zhiRun (cached ju)</option>
          <option value="1">1 · chaiBu (hour)</option>
        </select>
      </div>
      <div>
        <label for="starPath">Star path</label>
        <select id="starPath">
          <option value="0">0 · rotating</option>
          <option value="1">1 · flying</option>
        </select>
      </div>
      <div>
        <label for="birthTime">Birth time (enables victory days)</label>
        <input type="datetime-local" id="birthTime">
      </div>
      <div>
        <label for="maxNeg">Max negative structures</label>
        <input type="number" id="maxNeg" min="0" step="1" value="0">
      </div>
    </div>

    <div class="formgrid" style="margin-top:14px">
      <div>
        <label for="doors">Doors (comma separated)</label>
        <input type="text" id="doors" placeholder="loading…">
      </div>
      <div>
        <label for="stars">Stars</label>
        <input type="text" id="stars" placeholder="loading…">
      </div>
      <div>
        <label for="spirits">Spirits</label>
        <input type="text" id="spirits" placeholder="loading…">
      </div>
      <div>
        <label for="structures">Structures</label>
        <input type="text" id="structures" placeholder="loading…">
      </div>
    </div>

    <div class="checks">
      <label><input type="checkbox" id="lateZi"> late-zi day change (23:00)</label>
      <label><input type="checkbox" id="shift" checked> shift late-zi stream</label>
    </div>

    <div class="row">
      <button id="scan">Scan</button>
      <button id="today" class="secondary">This month</button>
      <span id="status" class="status"></span>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="days" id="days"></div>
</div>

<script>
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const title = s => String(s||"").replace(/_/g," ").replace(/\b\w/g, c => c.toUpperCase());

const PALACE_CN = { kan:"坎", kun:"坤", zhen:"震", xun:"巽", center:"中", qian:"乾", dui:"兑", gen:"艮", li:"离" };
let ABBR = {};

function showError(msg){
  const err = document.getElementById("err");
  err.textContent = msg;
  err.style.display = msg ? "block" : "none";
}
function setStatus(msg){ document.getElementById("status").textContent = msg || ""; }

function toLocalDate(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}

function initDates(){
  const now = new Date();
  document.getElementById("from").value = toLocalDate(new Date(now.getFullYear(), now.getMonth(), 1));
}

async function loadTables(){
  try{
    const r = await fetch("/api/qimen/tables");
    const t = await r.json();
    if(!r.ok) throw new Error(t.error || ("HTTP " + r.status));
    t.structures.forEach(s => { ABBR[s.name] = s.abbr || ""; });
    document.getElementById("doors").value = t.doors.join(", ");
    document.getElementById("stars").value = t.stars.join(", ");
    document.getElementById("spirits").value = t.spirits.join(", ");
    document.getElementById("structures").value = t.structures.filter(s => s.rating > 0 && s.almanacDefault)
      .map(s => s.name).join(", ");
  }catch(ex){
    showError(ex.message);
  }
}

function filtersFrom(fieldId){
  const raw = document.getElementById(fieldId).value.trim();
  if(!raw) return null;
  return raw.split(/[,\s]+/).filter(Boolean);
}

function hhmm(iso){
  return String(iso||"").slice(11,16);
}

function render(data){
  const days = data.days || [];
  const good = days.reduce((a,d) => a + d.goodHours.length, 0);
  const victories = days.filter(d => d.victoryDay).length;
  document.getElementById("summary").textContent =
    data.from + " → " + data.to + " · " + days.length + " day" + (days.length===1?"":"s") +
    " · " + good + " good hour" + (good===1?"":"s") +
    (data.victory ? " · " + victories + " victory day" + (victories===1?"":"s") : "");

  document.getElementById("days").innerHTML = days.map(d => {
    const v = d.victoryDay;
    const badge = v
      ? `<span class="badge">${esc(title(v.name))} victory · ${esc(PALACE_CN[v.palace]||v.palace)} ${esc(v.direction||"")}</span>`
      : "";
    const rows = d.goodHours.length
      ? d.goodHours.map(h => {
          const abbr = ABBR[h.structure.name];
          return `<li><span class="h">${esc(hhmm(h.time))} · ${esc(PALACE_CN[h.palace]||h.palace)}</span>` +
                 `<span class="s"><b>${esc(abbr ? abbr + " · " : "")}${esc(title(h.structure.name))}</b>` +
                 ` · +${esc(h.numPositiveStructures)}</span></li>`;
        }).join("")
      : `<li class="empty">No good hours.</li>`;
    return `<div class="day ${v?"victory":""}">` +
           `<h3>${esc(d.date)} ${badge}</h3>` +
           `<div class="count">${d.goodHours.length} good hour${d.goodHours.length===1?"":"s"}</div>` +
           `<ul class="hours">${rows}</ul></div>`;
  }).join("");
}

async function scan(){
  showError("");
  const from = document.getElementById("from").value;
  if(!from){ showError("Pick a start date."); return; }
  setStatus("Scanning…");
  document.getElementById("scan").disabled = true;

  const q = new URLSearchParams();
  q.set("from", from);
  const to = document.getElementById("to").value;
  if(to) q.set("to", to);
  q.set("method", document.getElementById("method").value);
  q.set("starPath", document.getElementById("starPath").value);
  q.set("lateZi", document.getElementById("lateZi").checked ? "true" : "false");
  q.set("shiftLateZiStream", document.getElementById("shift").checked ? "true" : "false");
  q.set("maxNegativeStructures", document.getElementById("maxNeg").value || "0");
  const birth = document.getElementById("birthTime").value;
  if(birth) q.set("birthTime", birth);

  for(const [param, field] of [["doors","doors"],["stars","stars"],["spirits","spirits"],["structures","structures"]]){
    const list = filtersFrom(field);
    if(list) list.forEach(v => q.append(param, v));
  }

  try{
    const started = Date.now();
    const r = await fetch("/api/qimen/days?" + q.toString());
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    render(data);
    setStatus("Done in " + ((Date.now()-started)/1000).toFixed(1) + "s");
  }catch(ex){
    document.getElementById("days").innerHTML = "";
    document.getElementById("summary").textContent = "";
    showError(ex.message);
    setStatus("");
  }finally{
    document.getElementById("scan").disabled = false;
  }
}

document.getElementById("scan").addEventListener("click", scan);
document.getElementById("today").addEventListener("click", () => {
  const now = new Date();
  document.getElementById("from").value = toLocalDate(new Date(now.getFullYear(), now.getMonth(), 1));
  document.getElementById("to").value = toLocalDate(new Date(now.getFullYear(), now.getMonth()+1, 0));
  scan();
});

initDates();
loadTables();
scan();
</script>
</body>
</html>
